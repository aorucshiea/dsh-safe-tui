# dsh-safe-tui bundle: mounts the safe-mode recovery TUI over dsh-base.
# This profile intentionally contains no web UI, no user plugins, and no
# user-authored preset root.
- insert:
    # The preset roster is part of the bundle so a fresh profile created with
    # `dsh plugin --profile safe add github:.../dsh-safe-tui` is complete
    # without extra manual patch files.
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: minimal
        includeUserRoot: false

    - id: safe-tui
      name: '@dsh-external/dsh-safe-tui'
      config: {}
